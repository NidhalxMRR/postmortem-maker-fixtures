name: wayback-probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/wayback-probe.yml'
      - 'wayback-targets.txt'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query Wayback CDX for each target
        run: |
          set -u
          mkdir -p out
          while IFS= read -r t; do
            [ -z "$t" ] && continue
            enc=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$t")
            echo "=== TARGET $t"
            for attempt in 1 2 3 4 5; do
              code=$(curl -s -m 60 -o "out/cdx.json" -w '%{http_code}' \
                "https://web.archive.org/cdx/search/cdx?url=${enc}&output=json&limit=2&filter=statuscode:200") || code=000
              echo "attempt $attempt HTTP $code"
              if [ "$code" = "200" ]; then break; fi
              sleep $((attempt * 12))
            done
            head -c 700 out/cdx.json
            echo
            sleep 6
          done < wayback-targets.txt
      - name: Egress IP for the record
        run: curl -s -m 20 https://api.ipify.org; echo
